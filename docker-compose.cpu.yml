# Docker Compose for Mac, Windows, or Linux without NVIDIA GPU
# Usage: docker compose -f docker-compose.cpu.yml up --build

services:
  transcription:
    build:
      context: .
      dockerfile: Dockerfile.cpu
    ports:
      # Using 5001 to avoid conflict with macOS AirPlay Receiver on port 5000
      - "5001:5000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      # Use medium model by default for CPU (large-v3 requires 16GB+ RAM)
      - WHISPER_MODEL=${WHISPER_MODEL:-medium}
    volumes:
      # Persist transcription outputs
      - ./outputs:/app/outputs
      # Persist speaker audio clips
      - ./clips:/app/clips
      # Cache HuggingFace models (saves re-downloading)
      - hf_cache:/root/.cache/huggingface
      # Cache torch models
      - torch_cache:/root/.cache/torch
    restart: unless-stopped

volumes:
  hf_cache:
  torch_cache:
