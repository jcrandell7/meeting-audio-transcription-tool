services:
  transcription:
    build: .
    ports:
      - "5000:5000"
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - NVIDIA_VISIBLE_DEVICES=all
    volumes:
      # Persist transcription outputs
      - ./outputs:/app/outputs
      # Persist speaker audio clips
      - ./clips:/app/clips
      # Cache HuggingFace models (saves re-downloading)
      - hf_cache:/root/.cache/huggingface
      # Cache torch models
      - torch_cache:/root/.cache/torch
    restart: unless-stopped
    # GPU support - uncomment the deploy section if you have NVIDIA GPU + nvidia-docker
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  hf_cache:
  torch_cache:
